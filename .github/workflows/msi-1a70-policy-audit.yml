        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-original-source-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/msi-source-audit/audit.log
          if-no-files-found: error
      - name: Upload source report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: msi-original-policy-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/msi-source-audit/policy-coverage.json
            ${{ runner.temp }}/msi-source-audit/decompressed-policy.json
            ${{ runner.temp }}/msi-source-audit/dxe-core-guid-reference.json
            ${{ runner.temp }}/msi-source-audit/bds-prebind.json
            ${{ runner.temp }}/msi-source-audit/bds-connect-refs.json
            ${{ runner.temp }}/msi-source-audit/security2-source.json
            ${{ runner.temp }}/msi-source-audit/ami-bds-connect-policy.json
            ${{ runner.temp }}/msi-source-audit/ami-bds-policy-methods.json
            ${{ runner.temp }}/msi-source-audit/extractor.log
          if-no-files-found: error
