name: MSI 1A70 original ROM policy source audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/msi-1a70-policy-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create persistent activity log
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/msi-source-audit"
          {
            echo "event=$GITHUB_EVENT_NAME repo=$GITHUB_REPOSITORY sha=$GITHUB_SHA ref=$GITHUB_REF run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            date -u
            uname -a
            python3 --version
            curl --version | head -1
          } > "$RUNNER_TEMP/msi-source-audit/audit.log" 2>&1
      - name: Select Python 3.12 for supported EFI parser binary extension
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify original MSI release and inspect raw firmware policy GUIDs
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/msi-source-audit"
          LOG="$OUT/audit.log"
          trap 'rc=$?; { echo "SOURCE_AUDIT_EXIT=$rc"; date -u; df -h .; } >> "$LOG" 2>&1; exit "$rc"' EXIT
          {
            echo "SCOPE=OFFLINE_ONLY HARDWARE_ACTION=NONE DRIVER_ACTION=NONE FIRMWARE_EXECUTION=NONE"
            expected_zip="1d924e6bebb76b09fb7cccfb4551f659a2c0b95563194923c013b792ec7645a9"
            found=0
            for url in "https://download.msi.com/bos_exe/mb/7E56v1A7.zip" "https://download.msi.com/bos_exe/mb/7E56v1A70.zip"; do
              echo "SOURCE_CANDIDATE=$url"
              if curl --fail --location --silent --show-error --retry 1 --connect-timeout 10 --max-time 65 "$url" -o "$OUT/vendor.zip"; then
                actual="$(sha256sum "$OUT/vendor.zip" | cut -d' ' -f1)"
                echo "VENDOR_ZIP_SHA256=$actual"
                if [ "$actual" = "$expected_zip" ]; then found=1; break; fi
              else
                echo "SOURCE_FETCH_FAILED=$url"
              fi
            done
            if [ "$found" -ne 1 ]; then
              echo "ERROR=NO_OFFICIAL_ZIP_MATCHED_PIN DO_NOT_ANALYZE_UNVERIFIED_IMAGE"
              exit 2
            fi
            python3 - "$OUT/vendor.zip" "$OUT/policy-coverage.json" "$OUT/original.bin" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import struct
          import sys
          import uuid
          import zipfile

          source = Path(sys.argv[1])
          report = Path(sys.argv[2])
          original_sha = "f9e32efb322221d829822ede474cf3a9fce20cc0324f98f4380741de0f5118e3"
          with zipfile.ZipFile(source) as z:
              members = [i for i in z.infolist() if i.filename.split("/")[-1] == "E7E56AMSI.1A70"]
              if len(members) != 1:
                  raise ValueError("expected one original MSI 1A70 BIOS member")
              item = members[0]
              if item.file_size < 16 * 1024 * 1024 or item.file_size > 64 * 1024 * 1024:
                  raise ValueError("BIOS size outside bounded limits")
              image = z.read(item)
              if z.testzip() is not None:
                  raise ValueError("ZIP member CRC invalid")
          digest = hashlib.sha256(image).hexdigest()
          if digest != original_sha:
              raise ValueError("original BIOS SHA mismatch: " + digest)
          Path(sys.argv[3]).write_bytes(image)
          volumes = []
          cursor = 0
          while True:
              at = image.find(b"_FVH", cursor)
              if at < 0:
                  break
              cursor = at + 4
              start = at - 0x28
              if start < 0 or at + 0x10 > len(image):
                  continue
              length = int.from_bytes(image[start + 0x20:start + 0x28], "little")
              hsize = int.from_bytes(image[start + 0x30:start + 0x32], "little")
              if length < 0x38 or hsize < 0x38 or hsize > length or length > len(image) - start:
                  continue
              volumes.append({"offset": start, "size": length, "header_bytes": hsize})
          ids = {
              "EFI_PLATFORM_DRIVER_OVERRIDE": "6B30C738-A391-11D4-9A3B-0090273FC14D",
              "EFI_PCI_PLATFORM": "07D75280-27D4-4D69-90D0-5643E238B341",
              "EFI_PCI_OVERRIDE": "B5B35764-460C-4A06-99FC-77A17C1B5CEB",
              "AMI_OPROM_POLICY": "542D6248-4198-4960-9F59-2384646D63B4",
              "AMI_OPROM_COMPANION": "DC14E697-775A-4C3B-A11A-EDC38E1BE3E6",
              "EFI_SECURITY2_ARCH": "94AB2F58-1438-4EF1-9152-18941A3A0E68",
              "EFI_SECURITY_ARCH": "A46423E3-4617-49F1-B9FF-D1BFA9115839",
              "AMI_BDS_CONNECT_POLICY": "38D65EC3-8F39-4660-B8A6-F36AA3925475",
          }
          results = {}
          for name, identity in ids.items():
              needle = uuid.UUID(identity).bytes_le
              matches = []
              pos = 0
              while True:
                  at = image.find(needle, pos)
                  if at < 0:
                      break
                  pos = at + 1
                  if len(matches) == 1024:
                      raise ValueError("GUID hit limit exceeded")
                  applicable = [v for v in volumes if v["offset"] <= at < v["offset"] + v["size"]]
                  region = min(applicable, key=lambda v: v["size"]) if applicable else None
                  matches.append({"rom_offset": at, "raw_volume_start": region["offset"] if region else None})
              results[name] = matches
          output = {
              "scope": "original vendor BIOS raw bytes only; no compressed-section decode",
              "zip_sha256_verified": True,
              "original_member_sha256": digest,
              "original_member_bytes": len(image),
              "firmware_volume_headers_bounded": volumes,
              "guid_raw_hits": results,
              "provider_identity_proven": False,
              "driver_binding_order_proven": False,
              "nvidia_release_proven": False,
              "gpu_mutation": False,
          }
          report.write_text(json.dumps(output, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("SOURCE_VERIFIED=1 ORIGINAL_BIOS_SHA256=" + digest)
          print("ROM_BYTES=" + str(len(image)) + " BOUNDED_FV_HEADERS=" + str(len(volumes)))
          for name, matches in results.items():
              print("GUID=" + name + " RAW_HITS=" + str(len(matches)) +
                    " OFFSETS=" + ",".join(hex(x["rom_offset"]) for x in matches))
          print("LIMITATION=RAW_LITERAL_SCAN_ONLY COMPRESSED_FFS_NOT_DECODED NO_PROVIDER_OR_RUNTIME_PROOF")
          PY
          echo "STARTING_BOUNDED_COMPRESSED_SOURCE_PARSE"
          python3 -m venv "$OUT/venv"
          "$OUT/venv/bin/python" -m pip install --disable-pip-version-check --no-input "uefi_firmware==1.11"
          mkdir -p "$OUT/extracted"
          if timeout 180 "$OUT/venv/bin/uefi-firmware-parser" -b -e -q -o "$OUT/extracted" "$OUT/original.bin" > "$OUT/extractor.log" 2>&1; then
            echo "EXTRACTOR_EXIT=0"
          else
            code=$?
            echo "EXTRACTOR_EXIT=$code"
            tail -60 "$OUT/extractor.log"
            exit "$code"
          fi
          python3 - "$OUT/extracted" "$OUT/decompressed-policy.json" <<'PY2'
          import hashlib
          import json
          from pathlib import Path
          import sys
          import uuid
          root = Path(sys.argv[1])
          report = Path(sys.argv[2])
          signatures = {
              "EFI_PLATFORM_DRIVER_OVERRIDE": "6B30C738-A391-11D4-9A3B-0090273FC14D",
              "EFI_PCI_PLATFORM": "07D75280-27D4-4D69-90D0-5643E238B341",
              "EFI_PCI_OVERRIDE": "B5B35764-460C-4A06-99FC-77A17C1B5CEB",
              "AMI_OPROM_POLICY": "542D6248-4198-4960-9F59-2384646D63B4",
              "AMI_OPROM_COMPANION": "DC14E697-775A-4C3B-A11A-EDC38E1BE3E6",
              "EFI_SECURITY2_ARCH": "94AB2F58-1438-4EF1-9152-18941A3A0E68",
              "EFI_SECURITY_ARCH": "A46423E3-4617-49F1-B9FF-D1BFA9115839",
              "AMI_BDS_CONNECT_POLICY": "38D65EC3-8F39-4660-B8A6-F36AA3925475",
          }
          needles = {n:uuid.UUID(g).bytes_le for n,g in signatures.items()}
          known = {
              "original_PciBus_PE": "d341ffee887f7bb9e51e70d87c1fd16edf92d4360bf835829eb9aac1cda7615f",
              "original_OptionRomPolicy_PE": "7da343f76c7cb983cf0a1120cdabc6c42747486d465726a29faa08f6a4815c27",
              "original_Shell_PE": "b91032f513a63625be9b32b9b3698468dd28f61a476a0d52dd7c71cef89d5203",
              "original_DXE_volume": "c297b1213cc3d90a40480bfbd6cce7ce56b9751e03443e5f96c2a89fc6a4df74",
          }
          files = sorted(root.rglob("*"))
          if len(files) > 20000:
              raise ValueError("unbounded extracted path count")
          results = {name:[] for name in needles}
          matched_pins = {name:[] for name in known}
          visited = {}
          total = 0
          unique_count = 0
          for path in files:
              if not path.is_file() or path.is_symlink():
                  continue
              size = path.stat().st_size
              if size > 64 * 1024 * 1024:
                  raise ValueError("oversized extracted item")
              total += size
              if total > 768 * 1024 * 1024:
                  raise ValueError("extracted input total size over limit")
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              name = str(path.relative_to(root))
              for known_name, known_sha in known.items():
                  if sha == known_sha:
                      matched_pins[known_name].append(name)
              if sha in visited:
                  continue
              visited[sha] = name
              unique_count += 1
              for item, needle in needles.items():
                  offset = 0
                  while True:
                      at = data.find(needle, offset)
                      if at < 0:
                          break
                      offset = at + 1
                      if len(results[item]) >= 400:
                          raise ValueError("GUID finding cap exceeded")
                      results[item].append({"relative_file": name, "sha256": sha,
                                            "file_bytes":size, "offset":at})
          output = {
              "scope": "tool-decoded EFI archive objects and sections; not proven complete",
              "extractor_version": "uefi_firmware 1.11",
              "extracted_paths": len(files),
              "total_extracted_file_bytes":total,
              "unique_extracted_file_contents":unique_count,
              "known_exact_object_hashes":matched_pins,
              "guid_hits":results,
              "complete_firmware_decode_proven":False,
              "guid_absence_does_not_prove_no_provider":True,
              "original_driver_invocation_proven":False,
              "hardware_mutation":False
          }
          report.write_text(json.dumps(output, indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("EXTRACTED_PATHS=%d UNIQUE_CONTENTS=%d TOTAL_BYTES=%d"%
                (len(files),unique_count,total))
          for item, found in results.items():
              print("EXTRACTED_GUID="+item+" HITS="+str(len(found)))
              for row in found[:8]:
                  print("HIT="+item+" FILE="+row["relative_file"]+" AT="+hex(row["offset"]))
          print("AMI_BDS_CONNECT_POLICY_ORIGINAL_PE_TARGETS="+str([
              row for row in results["AMI_BDS_CONNECT_POLICY"]
              if row["relative_file"].endswith(".pe")
          ]))
          for item, found in matched_pins.items():
              print("KNOWN_SHA_MATCH="+item+" COUNT="+str(len(found)))
          print("LIMIT=DECODE_COVERAGE_UNPROVEN NOT_A_HARDWARE_OR_PROVIDER_PROOF")
          PY2
          python3 - "$OUT/extracted" "$OUT/dxe-core-guid-reference.json" <<'PY3'
          import hashlib
          import json
          from pathlib import Path
          import struct
          import subprocess
          import sys
          import uuid
          root = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          target_guid = "d6a2cb7f-6a18-4e2f-b43b-9920a733700a"
          matches = [p for p in root.rglob("*.pe") if
                     ("file-" + target_guid + "/") in (str(p.relative_to(root)).lower() + "/")]
          if len(matches) != 1:
              raise ValueError("expected one exact original DXE_CORE PE, found %d" % len(matches))
          path = matches[0]
          data = path.read_bytes()
          if data[:2] != b"MZ":
              raise ValueError("original DXE CORE is not PE")
          at = struct.unpack_from("<I", data, 0x3c)[0]
          if data[at:at+4] != b"PE\0\0":
              raise ValueError("invalid original PE signature")
          count = struct.unpack_from("<H", data, at+6)[0]
          op_size = struct.unpack_from("<H", data, at+20)[0]
          opt = at + 24
          if struct.unpack_from("<H", data, opt)[0] != 0x20b:
              raise ValueError("original DXE CORE is not PE32+")
          base = struct.unpack_from("<Q", data, opt+24)[0]
          entry = struct.unpack_from("<I", data, opt+16)[0]
          subsys = struct.unpack_from("<H", data, opt+68)[0]
          sections = []
          for i in range(count):
              off = opt + op_size + i * 40
              name = data[off:off+8].split(b"\0")[0].decode("ascii","replace")
              virt_size,rva,raw_len,raw_at = struct.unpack_from("<IIII",data,off+8)
              if raw_at > len(data) or raw_len > len(data)-raw_at:
                  raise ValueError("original PE section invalid")
              sections.append((name,virt_size,rva,raw_len,raw_at))
          needle = uuid.UUID("6B30C738-A391-11D4-9A3B-0090273FC14D").bytes_le
          positions = []
          for i,s in enumerate(sections):
              name,virt,rva,size,raw_at = s
              pos = data.find(needle,raw_at,raw_at+size)
              while pos >= 0:
                  positions.append((pos,rva+pos-raw_at,name))
                  pos = data.find(needle,pos+1,raw_at+size)
          refs = []
          for name,virt,rva,raw_len,raw_at in sections:
              if name.lower() != ".text":
                  continue
              block = data[raw_at:raw_at+raw_len]
              for i in range(len(block)-7):
                  if block[i] not in (0x48,0x4c) or block[i+1] not in (0x8d,0x8b):
                      continue
                  if block[i+2] & 0xc7 != 5:
                      continue
                  disp = struct.unpack_from("<i",block,i+3)[0]
                  insn_rva = rva+i
                  dest = insn_rva+7+disp
                  if any(dest==p[1] for p in positions):
                      refs.append({"site_rva":insn_rva,"target_rva":dest,
                                   "code_bytes":block[max(0,i-12):i+24].hex()})
          result = {"identity":"DXE_CORE_FFS","ffs_guid":target_guid,
                    "original_pe_path":str(path.relative_to(root)),
                    "pe_sha256":hashlib.sha256(data).hexdigest(),
                    "pe_bytes":len(data),"image_base":hex(base),
                    "entry_rva":hex(entry),"pe_subsystem":subsys,
                    "sections":[{"name":x[0],"rva":hex(x[2]),"raw_bytes":x[3]} for x in sections],
                    "platform_override_guid_locations":
                      [{"offset":hex(p),"rva":hex(rv),"section":name} for p,rv,name in positions],
                    "bounded_rip_relative_reference_candidates":refs,
                    "full_control_flow_proven":False,"provider_proven":False,"hardware_mutation":False}
          destination.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("DXE_CORE_PE_SHA256="+result["pe_sha256"]+" BYTES="+str(len(data))+
                " ENTRY_RVA="+hex(entry)+" SUBSYSTEM="+str(subsys))
          print("DXE_CORE_GUID_OFFSETS="+str(result["platform_override_guid_locations"]))
          print("DXE_CORE_CANDIDATE_RIP_REFS="+str(len(refs)))
          for ref in refs[:10]:
              print("DXE_CORE_RIP_REF="+str(ref))
              start=max(0,base+ref["site_rva"]-32)
              stop=base+ref["site_rva"]+48
              try:
                  call=subprocess.run(["objdump","-d","-Mintel",
                                      "--start-address="+hex(start),
                                      "--stop-address="+hex(stop),str(path)],
                                      capture_output=True,text=True,timeout=10)
                  print("ORIGINAL_DISASM_BEGIN="+hex(ref["site_rva"])+" EXIT="+str(call.returncode))
                  print((call.stdout or call.stderr)[-3600:])
                  print("ORIGINAL_DISASM_END")
              except Exception as exc:
                  print("ORIGINAL_DISASM_ERROR="+str(exc))
          PY3
          python3 - "$OUT/extracted" "$OUT/bds-prebind.json" "$OUT/bds-original.pe" <<'PY4'
          from pathlib import Path
          import hashlib
          import json
          import struct
          import sys
          root = Path(sys.argv[1])
          report = Path(sys.argv[2])
          copied_original = Path(sys.argv[3])
          candidates = []
          for p in root.rglob("*.pe"):
              if p.is_symlink() or p.stat().st_size > 4 * 1024 * 1024:
                  continue
              data = p.read_bytes()
              if b"D\x00r\x00i\x00v\x00e\x00r\x00O\x00r\x00d\x00e\x00r\x00" not in data:
                  continue
              candidates.append({
                  "path": str(p.relative_to(root)),
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "driver_format_matches": data.count("Driver%04X".encode("utf-16le")),
                  "ascii_driver_matches": data.count(b"Driver%04X"),
                  "bds_registration_ptr": data[0x16e58:0x16e60].hex() if len(data)>0x16e60 else None
              })
          print("BDS_DRIVERORDER_CANDIDATES="+str(len(candidates)))
          for c in candidates[:20]:
              print("BDS_CANDIDATE="+json.dumps(c,sort_keys=True))
          accepted = [c for c in candidates if c["driver_format_matches"] or c["ascii_driver_matches"]]
          if len(accepted)!=1:
              raise ValueError("expected one original BDS PE with DriverOrder and Driver%04X; actual %d" % len(accepted))
          name=accepted[0]["path"]
          data=(root/name).read_bytes()
          copied_original.write_bytes(data)
          if data[:2]!=b"MZ":
              raise ValueError("BDS missing DOS signature")
          pe=struct.unpack_from("<I",data,0x3c)[0]
          if data[pe:pe+4]!=b"PE\0\0":
              raise ValueError("BDS missing PE signature")
          count=struct.unpack_from("<H",data,pe+6)[0]
          opsize=struct.unpack_from("<H",data,pe+20)[0]
          opt=pe+24
          if struct.unpack_from("<H",data,opt)[0]!=0x20b:
              raise ValueError("BDS expected PE32+")
          base=struct.unpack_from("<Q",data,opt+24)[0]
          entry=struct.unpack_from("<I",data,opt+16)[0]
          sections=[]
          for i in range(count):
              off=opt+opsize+i*40
              name_bytes=data[off:off+8].split(b"\0")[0].decode("ascii","replace")
              virtual_size,rva,raw_len,raw_at=struct.unpack_from("<IIII",data,off+8)
              if raw_at>len(data) or raw_len>len(data)-raw_at:
                  raise ValueError("BDS section out of range")
              sections.append((name_bytes,rva,raw_at,raw_len))
          text_sections=[s for s in sections if s[0]==".text"]
          if len(text_sections)!=1:
              raise ValueError("BDS must have one text section")
          _,text_rva,text_off,text_length=text_sections[0]
          text_data=data[text_off:text_off+text_length]
          refs=[]
          for i in range(len(text_data)-5):
              if text_data[i]!=0xe8:
                  continue
              target=text_rva+i+5+struct.unpack_from("<i",text_data,i+1)[0]
              if target in (0xcd4,0x1210,0x550):
                  refs.append({"site_rva":hex(text_rva+i),"target_rva":hex(target),
                               "raw_bytes":text_data[max(0,i-10):i+12].hex(),
                               "instruction_alignment_proven":False})
          emitted={
              "source":"verified original MSI 1A70 extracted BDS PE",
              "original_bios_member_sha256_verified":True,
              "selected":accepted[0],
              "pe_image_base":hex(base),
              "entry_rva":hex(entry),
              "sections":[{"name":s[0],"rva":hex(s[1]),"bytes":s[3]} for s in sections],
              "candidate_near_call_edges":refs,
              "complete_bds_connection_order_proven":False,
              "driverorder_before_first_nvidia_binding_proven":False,
              "hardware_mutation":False
          }
          report.write_text(json.dumps(emitted,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("BDS_SELECTED_SHA256="+accepted[0]["sha256"]+" IMAGE_BASE="+hex(base)+" ENTRY="+hex(entry))
          print("BDS_DIRECT_E8_NEAR_TARGETS="+str(refs))
          PY4
          echo "BDS_ORIGINAL_CALLBACK_BYTE_DISASSEMBLY_BEGIN"
          objdump -d -Mintel --start-address=0x1200 --stop-address=0x1450 "$OUT/bds-original.pe" | tail -200 | head -190
          echo "BDS_ORIGINAL_CALLBACK_BYTE_DISASSEMBLY_END"
          echo "BDS_ORIGINAL_EARLY_ENTRY_BYTE_DISASSEMBLY_BEGIN"
          objdump -d -Mintel --start-address=0x500 --stop-address=0x660 "$OUT/bds-original.pe" | head -140
          echo "BDS_ORIGINAL_EARLY_ENTRY_BYTE_DISASSEMBLY_END"
          echo "SOURCE_DECISION=STATIC_BDS_ONLY FIRST_NVIDIA_BIND_TIME_UNKNOWN"
          python3 - "$OUT/bds-original.pe" <<'PY5'
          import struct
          import sys
          data=open(sys.argv[1],"rb").read()
          pe=struct.unpack_from("<I",data,0x3c)[0]
          opt=pe+24
          sections=[]
          for i in range(struct.unpack_from("<H",data,pe+6)[0]):
              start=opt+struct.unpack_from("<H",data,pe+20)[0]+i*40
              name=data[start:start+8].split(b"\0")[0].decode("ascii","replace")
              vsize,rva,rlen,raw=struct.unpack_from("<IIII",data,start+8)
              sections.append((name,rva,rlen,raw))
          pdatas=[a for a in sections if a[0]==".pdata"]
          if len(pdatas)!=1:
              print("BDS_PDATA_UNAVAILABLE=1 SECTION_NAMES="+repr([s[0] for s in sections]))
              pdatas=[("unavailable",0,0,0)]
          _,_,size,raw=pdatas[0]
          records=[]
          for off in range(raw,raw+size,12):
              if off+12>len(data):
                  break
              st,end,unwind=struct.unpack_from("<III",data,off)
              if st<end and end<0x400000:
                  records.append((st,end,unwind))
          targets=[0x514,0x550,0xcd4,0x1210,0x142d,0x2f5f,0x31a7]
          print("BDS_PDATA_BOUNDED_FUNCTIONS="+str(len(records)))
          for value in targets:
              hits=[(hex(st),hex(end),hex(uw)) for st,end,uw in records if st<=value<end]
              print("BDS_PDATA_AT="+hex(value)+" CONTAINING="+repr(hits))
          PY5
          for pair in "0xc80 0xd80" "0x2e80 0x2fb0" "0x3080 0x31f0"; do
            set -- $pair
            echo "ORIGINAL_BDS_DISASM_BEGIN $1 .. $2"
            objdump -d -Mintel --start-address="$1" --stop-address="$2" "$OUT/bds-original.pe" | head -120
            echo "ORIGINAL_BDS_DISASM_END"
          done
